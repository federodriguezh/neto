name: Update CEDEAR History

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance requests

      - name: Fetch CEDEAR history
        run: python scripts/fetch_cedear_history.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/cedears/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: update CEDEAR history ($(date -u +%Y-%m-%d))"
            git push
          fi
